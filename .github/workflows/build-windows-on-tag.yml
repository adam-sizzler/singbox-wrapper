name: Build Windows Binary On Tag

on:
  push:
    tags:
      - "*"
  release:
    types:
      - published
      - edited

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install mingw-w64 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

      - name: Resolve tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "value=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare changelog
        id: changelog
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          git fetch --tags --force || true
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$' | grep -v "^${TAG}$" | head -n 1 || true)
          fi
          echo "Current tag: ${TAG}"
          echo "Previous tag: ${PREV_TAG}"
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(npx -y changelogen@latest --no-contributors --from="$PREV_TAG" --to="$TAG" 2>/dev/null | sed '/^\[log\]/d' || true)
          else
            CHANGELOG=$(npx -y changelogen@latest --no-contributors 2>/dev/null | sed '/^\[log\]/d' || true)
          fi
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="Release ${TAG}"
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$CHANGELOG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Build windows binary
        run: |
          make build-windows RELEASE_TAG=${{ steps.tag.outputs.value }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: singbox-wrapper-windows-${{ steps.tag.outputs.value }}
          path: singbox-wrapper.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: ${{ steps.tag.outputs.value }}
          generate_release_notes: false
          make_latest: true
          draft: false
          prerelease: false
          body: |
            🚀 singbox-wrapper ${{ steps.tag.outputs.value }}

            ${{ env.CHANGELOG }}
          files: singbox-wrapper.exe
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
